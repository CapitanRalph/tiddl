name: Release installers

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Compilar tambien el ejecutable portable Windows"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    env:
      UV_PYTHON: "3.12"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Ruff
        run: uv run ruff check tiddl tests packaging

      - name: Mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Build installer icons
        run: uv run python packaging/icons/build-icons.py

      - name: Build macOS app bundle
        run: uv run pyinstaller packaging/pyinstaller/tiddl-desktop.spec --clean --noconfirm

      - name: Build DMG
        env:
          TIDDL_BUILD_ARCH: ${{ matrix.arch }}
        run: sh packaging/macos/build-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: dist/Tiddl-DDJ-v*-macOS-${{ matrix.arch }}.dmg

  build-windows-x64:
    name: Windows x64 Portable
    if: github.event_name == 'push' || inputs.build_windows
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Ruff
        run: uv run ruff check tiddl tests packaging

      - name: Mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Build installer icons
        run: uv run python packaging/icons/build-icons.py

      - name: Build Windows app bundle
        run: uv run pyinstaller packaging/pyinstaller/tiddl-desktop.spec --clean --noconfirm

      - name: Build Windows portable EXE
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-portable.ps1

      - name: Upload Windows portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: dist/Tiddl-DDJ-v*-Windows-x64-Portable.exe

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-macos
      - build-windows-x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --title "Tiddl DDJ $TAG_NAME" --generate-notes
          fi
