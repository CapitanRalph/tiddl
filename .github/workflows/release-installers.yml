name: Release installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: macOS arm64 DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check tiddl tests packaging
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python packaging/icons/build-icons.py
      - run: uv run pyinstaller packaging/pyinstaller/tiddl-desktop.spec --clean --noconfirm
      - run: sh packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: dist/Tiddl-DDJ-v*-macOS-arm64.dmg

  build-windows-x64:
    name: Windows x64 Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: choco install innosetup -y
      - run: uv sync --dev
      - run: uv run ruff check tiddl tests packaging
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python packaging/icons/build-icons.py
      - run: uv run pyinstaller packaging/pyinstaller/tiddl-desktop.spec --clean --noconfirm
      - run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-setup
          path: dist/Tiddl-DDJ-v*-Windows-x64-Setup.exe

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-macos-arm64
      - build-windows-x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --title "Tiddl DDJ $TAG_NAME" --generate-notes
          fi
