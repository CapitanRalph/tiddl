[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiddl"
version = "1.1.13"
description = "Download Tidal tracks with CLI downloader."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "oskvr37" }]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "aiofiles>=25.1.0",
  "aiohttp>=3.13.2",
  "fastapi>=0.121.0",
  "m3u8>=6.0.0",
  "mutagen>=1.47.0",
  "PySide6>=6.8.0",
  "python-multipart>=0.0.20",
  "pywebview>=6.0",
  "qtpy>=2.4.0",
  "pydantic>=2.12.4",
  "requests>=2.32.5",
  "requests-cache>=1.2.1",
  "typer>=0.20.0",
  "uvicorn>=0.38.0",
]

[project.urls]
homepage = "https://github.com/CapitanRalph/tiddl"

[project.scripts]
tiddl = "tiddl.cli.app:app"
tiddl-desktop = "tiddl.cli.commands.desktop:main"

[tool.setuptools.package-data]
"tiddl.web" = ["assets/*.png"]

[tool.coverage.run]
omit = ["*/models/*", "*/models.py"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["tiddl/web", "tiddl/updater.py", "tiddl/cli/commands/desktop.py"]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
